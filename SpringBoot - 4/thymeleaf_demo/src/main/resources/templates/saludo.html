<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Saludo Benja</title>
</head>
<body>
<!--!
- Etiqueta `th` para decir que vamos a usar Thymeleaf
- Especifico el tipo de dato que uso `:text`
- Dentro del `text` pongo lo que quiera pero con '' comillas simple
- Ademas pongo entre ${} el atributo que asigen o envie desde el @Controller
-->

<h1 th:text="'Hello! - ' + ${name}"></h1>


</body>

</html>
