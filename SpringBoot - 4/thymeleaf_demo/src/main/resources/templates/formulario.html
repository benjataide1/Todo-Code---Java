<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario de personas</title>
</head>
<body>

<h2>Ingreso de Datos</h2>
<!--
th:action="@{/procesar}" indica que el formulario enviará los datos a la ruta/url "/procesar"
cuando se haga clic en el botón de enviar.

th:object="${persona}" indica que el formulario está vinculado a un objeto llamado "persona" en el modelo.

th:field="*{nombreAtributoObjecto}" indica que el valor del input se va a asignar a ese atributo del Objeto Persona.
-->
<form th:action="@{/procesar}" th:object="${persona}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required><br><br>

    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname" th:field="*{lastname}" required><br><br>

    <label for="edad">Edad:</label>
    <input type="number" id="edad" th:field="*{age}" required><br><br>

    <input type="submit" value="Enviar">
</form>
</body>
</html>
